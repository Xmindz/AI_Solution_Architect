      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line);padding:7px 13px" onclick="breakAdjust(-5)">-5</button>
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line);padding:7px 13px" onclick="breakAdjust(-1)">-1</button>
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line);padding:7px 13px" onclick="breakAdjust(1)">+1</button>
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line);padding:7px 13px" onclick="breakAdjust(5)">+5</button>
    </div>
    <div style="display:flex;gap:9px">
      <button class="jbtn rev" id="breakbtn" onclick="breakToggle()">START</button>
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line)" onclick="breakStop()">STOP</button>
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line)" onclick="breakReset()">RESET</button>
    </div>
  </div>
</div>`,

/* 5 THE ROUND TABLE: THE SITUATION */
`<div class="eyebrow reveal"><span class="dot"></span> THE ROUND TABLE &middot; THE SITUATION ON THE TABLE</div>
<h2 class="reveal">A credit algorithm a regulator examined and cleared. The programme still cost $89 million and the partnership.</h2>
<p class="sub reveal">Apple Card, issued by Goldman Sachs Bank and branded by Apple. Every line below is public and dated. You are being dropped into the room that has to say what the problem actually was, and the ten people in it do not agree.</p>
<div class="tablefill reveal" style="margin-top:9px">
  <div class="maprow3 maphead" style="grid-template-columns:0.66fr 1.72fr 1.18fr"><div>When</div><div>What happened</div><div>What it meant</div></div>
  <div class="maprow3" style="grid-template-columns:0.66fr 1.72fr 1.18fr"><div><b>AUG 2019<br>the shape</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)">The card launches. <b>Goldman Sachs Bank underwrites it and owns the credit decision.</b> Apple brands it, owns the experience in the wallet and owns the customer relationship.</div><div>The decision and the relationship sit in <b>different companies</b>. Everything that follows comes out of that one line.</div></div>
  <div class="maprow3" style="grid-template-columns:0.66fr 1.72fr 1.18fr"><div><b>NOV 2019<br>the post</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)">A software engineer posts that his limit is <b>20 times his wife's</b>, on joint tax returns, in a community-property state, with her holding the higher credit score. Steve Wozniak replies that his was <b>10 times</b> his wife's. The answer from support: <b>"this is just how it is and you just have to accept that."</b></div><div>The model may well be fine. <b>Nobody anywhere in the chain can explain one decision to one customer</b>, and that is now a public fact.</div></div>
  <div class="maprow3" style="grid-template-columns:0.66fr 1.72fr 1.18fr"><div><b>MAR 2021<br>the finding</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)">New York's financial regulator finds <b>no unlawful discrimination</b>, after several thousand pages, written responses from both firms, interviews, and underwriting data for about <b>400,000 New York applicants</b>. Men and women with similar credit profiles generally got similar outcomes. It also finds that <b>weak customer service and a perceived lack of transparency reduced consumer trust</b>.</div><div><b>The model was cleared and the programme was not.</b> That gap is the entire case, and it is the reason this is in a session about architecture rather than about fairness.</div></div>
  <div class="maprow3" style="grid-template-columns:0.66fr 1.72fr 1.18fr"><div><b>OCT 2024<br>the bill</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)">The consumer regulator orders about <b>$89m</b>: Goldman <b>$45m</b> plus <b>$20m</b> in redress, Apple <b>$25m</b>. Disputes not processed, disputes sent across and never investigated, credit reports damaged, and interest charged to customers who expected automatic interest-free financing. <b>Hundreds of thousands</b> affected. The director's words: <b>"not mere technicalities... real harm to real people."</b></div><div><b>None of that is the credit model.</b> All of it is the operating model around it, which nobody in the room had been asked to design.</div></div>
  <div class="maprow3" style="grid-template-columns:0.66fr 1.72fr 1.18fr"><div><b>2025<br>the exit</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)">Goldman leaves the partnership. JPMorgan Chase takes the card over in a reported two-year transition.</div><div>The partnership <b>was</b> the architecture, and it is the part that did not survive contact with a customer asking why.</div></div>
  <div class="mapnote"><b>What is still not published, which is where your problem is hiding:</b> what a customer was actually told when they asked why, who owned that answer, and whether an explanation existed anywhere in the chain at all. <b>Sources:</b> NY Department of Financial Services report and press release, 23 March 2021. CFPB order and reporting, 23 October 2024. Contemporary reporting of the November 2019 posts and of the 2025 transition.</div>
</div>
<div class="actbar reveal" style="margin-top:auto"><div class="lab">The request<br>on your desk</div><p><b>"Everyone here has a different theory about what went wrong. Get them in a room and come back with one problem statement we can act on."</b> You are not being asked to judge the model, and you are not being asked whether the regulator was right. Both of those are settled.</p></div>`,

/* 6 THE ROUND TABLE: TEN SEATS */
`<div class="eyebrow reveal"><span class="dot"></span> THE ROUND TABLE &middot; TAKE ONE SEAT AND STAY IN IT</div>
<h2 class="reveal">Ten seats at the table. Seven are always filled. Three are filled only if your pod is large enough.</h2>
<p class="sub reveal">Each person takes one seat and argues from inside it for the whole session, including the parts that make you look unreasonable. The last three are marked optional: drop them from the bottom up if your pod is smaller.</p>
<div class="tablefill reveal" style="margin-top:9px">
  <div class="maprow3 maphead" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div>Seat</div><div>What you are measured on</div><div>Your opening position, which you must defend before you may move</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>1 &middot; CHIEF EXECUTIVE, THE BANK</b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">The consumer strategy, the partnership, the board</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"This card was how we entered consumer banking. The problem is that we bought a brand relationship we did not control and a service operation we had never run before."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>2 &middot; HEAD OF CREDIT UNDERWRITING</b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Approval rates, loss rates, fair lending</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"The model never sees gender and I can prove it, because a regulator just did, over 400,000 applicants. What I could never do was tell one customer why she got what she got."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>3 &middot; HEAD OF DATA SCIENCE</b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Model performance, drift, fairness testing</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"Every fairness test we run passes and they passed then. If there was harm, it happened somewhere I was never asked to instrument."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>4 &middot; CHIEF RISK AND COMPLIANCE OFFICER</b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Regulatory findings, complaints upheld</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"We were examined and cleared on lending, then fined on handling. I was asked to sign off a model. Nobody asked me to sign off the explanation that goes with it."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>5 &middot; HEAD OF SERVICE AND DISPUTES</b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Handling time, resolution rate, backlog</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"My people were handed a decision they could not see inside and a script that said it is the algorithm. Then the disputes queue broke, and that is the one that actually cost us."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>6 &middot; PRODUCT LEAD, THE BRAND PARTNER</b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">The brand, the experience in the wallet</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"Our name is on the card. Our customers blame us for a decision we do not make and cannot see. That is not a communications problem and I will not accept it as one."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>7 &middot; GENERAL COUNSEL</b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Examinations, consent orders, exposure</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"A regulator never asks whether it is accurate. It asks you to show why this person got this. We could not, and being right in the end did not help us at all."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>8 &middot; HEAD OF COMMUNICATIONS <span class="chip amber" style="font-size:8.5px;padding:1px 5px">OPTIONAL</span></b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">The public story</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"One post made this a national story in a day. The finding that cleared us arrived sixteen months later and almost nobody read it."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>9 &middot; CONSUMER ADVOCACY LEAD <span class="chip amber" style="font-size:8.5px;padding:1px 5px">OPTIONAL</span></b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Access, trust, vulnerable customers</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"The finding says the decisions were explainable. Explainable to a regulator and explainable to the person on the phone are two different products, and we only ever built one."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>10 &middot; INVESTOR RELATIONS <span class="chip amber" style="font-size:8.5px;padding:1px 5px">OPTIONAL</span></b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">The story told to the market</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"I am explaining a fine, an exit and a provision against a consumer strategy we announced from a stage."</div></div>
  <div class="mapnote">All ten are defensible, incomplete and incompatible with at least two others. The uncomfortable one is seat 2: <b>the model was cleared, and the person who built it still could not answer the question that mattered.</b></div>
</div>`,

/* 7 THE ROUND TABLE: THE BRIEF */
`<div class="eyebrow reveal"><span class="dot"></span> THE ROUND TABLE &middot; WHAT YOUR POD HANDS BACK</div>
<h2 class="reveal">One problem statement everybody signs, plus the objection you could not resolve</h2>
<p class="sub reveal">A problem statement, not a solution and not a risk list. It has to be true from inside more than one of those ten seats, and the parts that could not be reconciled get written down rather than quietly dropped.</p>
<div class="tablefill reveal" style="margin-top:9px">
  <div class="maprow3 maphead" style="grid-template-columns:0.84fr 1.74fr 0.92fr"><div>What you write</div><div>What has to be in it</div><div>Where it comes from</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.74fr 0.92fr"><div><b>1 &middot; THE STATEMENT</b></div><div style="font-family:var(--body);font-size:12.1px;color:var(--ink)">One sentence. The business cost or risk, in words the chief executive and the disputes lead would both recognise. <b>No technology named.</b> Not "the model was opaque". What was lost, to whom, and how it showed up.</div><div>Translating business drivers</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.74fr 0.92fr"><div><b>2 &middot; THE CONSTRAINT YOU ACCEPTED</b></div><div style="font-family:var(--body);font-size:12.1px;color:var(--ink)">Name the one constraint your statement treats as fixed, and say whether it is <b>law, contract, policy or merely habit</b>. Then say who in the room would have to move for it to change.</div><div>Trade-off analysis</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.74fr 0.92fr"><div><b>3 &middot; THE SIGNAL THAT WAS MISSING</b></div><div style="font-family:var(--body);font-size:12.1px;color:var(--ink)">Which single number, had it existed on somebody's screen, would have surfaced this before it became public. <b>Name the seat that should have owned it</b>, from the ten.</div><div>Evaluation and operations</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.74fr 0.92fr"><div><b>4 &middot; THE DISSENT</b></div><div style="font-family:var(--body);font-size:12.1px;color:var(--ink)">One seat that still disagrees, named, with their objection in their own words and one line on why the pod went ahead anyway. <b>A pod with no dissent did not have a disagreement, it had a quiet person.</b></div><div>Holistic viewpoint</div></div>
  <div class="mapnote">Then <b>three spoken lines</b> in the main room: the statement, the constraint you accepted, and the dissent with the seat that holds it. Write them verbatim before you finish and decide who reads them. Nothing from this session is collected or marked.</div>
</div>
<div class="listen reveal">
  <div class="lsitem"><div class="lh">What good looks like</div><p>A statement that would still be true if the model had been perfect. A constraint correctly classified as contract rather than law, or the reverse. A signal specific enough that one named seat could go and build it. A dissent that genuinely bites.</p></div>
  <div class="lsitem"><div class="lh">What not to write</div><p>"The algorithm was biased." The regulator looked and said otherwise. A statement with a technology inside it. A constraint that is really a preference. A signal called "better monitoring". A dissent invented at the end. Any sentence that blames the model.</p></div>
  <div class="lsitem"><div class="lh">How the room runs</div><p>Four phases, and I will call the length of each on the day. <b>Silent</b>, reading your own seat only. Then <b>round robin</b>, one equal turn a seat, <b>no interruptions and no replies</b>. Then <b>open</b>, to converge and write. Then <b>closing</b>, to rehearse the three lines aloud inside the pod.</p></div>
</div>
<div class="workband reveal" style="margin-top:auto">
  <div class="lab">The one<br>rule</div>
  <p><b>Nobody may propose a problem statement until every seat has spoken once.</b> That single rule is what separates this from a meeting, and it is the one most pods break in the first five minutes.</p>
  <div style="display:flex;gap:7px;flex-wrap:wrap">
    <button class="jbtn rev" onclick="document.getElementById('tm').classList.add('on')">Open the timer</button>
  </div>
</div>`,

/* 8 POD NOTES */
`<div class="eyebrow reveal"><span class="dot"></span> DEBRIEF &middot; WHAT EACH POD CAME BACK WITH</div>
<h2 class="reveal">Three spoken lines a pod: the statement, the constraint, the dissent</h2>
<p class="sub reveal">Statement first, in the words you agreed. No account of how the argument went and no fourth line. I am typing as you speak, and the seats that disagreed are the part I most want on the board.</p>
<div class="grid3 reveal" style="margin-top:9px">
  <div class="card" style="border-left:3px solid var(--clay);padding:9px 12px"><div class="label">LINE 1 &middot; THE STATEMENT</div><p style="font-size:11.5px;margin-top:4px;line-height:1.34">The business cost or risk, in one sentence, with no technology in it. If a listener could not tell which company this was about, it is too generic.</p></div>
  <div class="card" style="border-left:3px solid var(--cobalt);padding:9px 12px"><div class="label">LINE 2 &middot; THE CONSTRAINT</div><p style="font-size:11.5px;margin-top:4px;line-height:1.34">The one you treated as fixed, classified as law, contract, policy or habit, and the seat that would have to move for it to change.</p></div>

</div>
<div class="podpad" data-pad="1">

    <button class="ppbtn" onclick="podMore('1')">+ POD</button>

    <button class="ppbtn" onclick="podClear('1')">CLEAR</button>

</div>
<div class="actbar reveal"><div class="lab">Then we<br>compare</div><p>Put the statements side by side. Where two pods wrote different statements from the same ten seats, the difference is almost always <b>which seat they let win</b>. That is worth more than either statement, because in your own estate the seat that wins is usually decided before the meeting starts.</p></div>`,

/* 9 THE VALUE */
`<div class="eyebrow reveal"><span class="dot"></span> CLOSING &middot; WHY THE DAY WAS BUILT THIS WAY</div>
<h2 class="reveal">Four things you can now do that a reading list would not have given you</h2>
<p class="sub reveal">None of these cases turn on a technology being good or bad, and the last one was examined by a regulator, cleared, and failed anyway. Here is what each part of the session was actually training.</p>
<div class="tablefill reveal" style="margin-top:9px">
  <div class="maprow3 maphead" style="grid-template-columns:0.94fr 1.48fr 1.42fr"><div>What you can now do</div><div>Where in today you practised it</div><div>Why it matters at your own desk</div></div>
  <div class="maprow3" style="grid-template-columns:0.94fr 1.48fr 1.42fr"><div><b>TURN A BUSINESS WORD INTO SOMETHING DESIGNABLE</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)">"Reduce cloud spend" became cost per byte at a known read pattern, and only then did a hardware answer become possible. The pillars and the 4E model both start there.</div><div>Most requests arrive as business words with a technology already attached. The translation step is the one nobody does, and it is where your leverage is.</div></div>
  <div class="maprow3" style="grid-template-columns:0.94fr 1.48fr 1.42fr"><div><b>COMMIT TO ONE FAILURE, OUT LOUD</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)">Three lines to the room: the failure you would bet on, the signal, the decision. Naming five ways something could fail is easy. Saying which one you would put money on, in front of other people, is not.</div><div>Every review you ever sit in asks you to rank. <b>The ranking is the opinion, and the opinion is the thing you are paid for.</b></div></div>
  <div class="maprow3" style="grid-template-columns:0.94fr 1.48fr 1.42fr"><div><b>SEE THAT THE ARCHITECTURE OWNS THE COST OF AN ERROR</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)">A credit model a regulator read across 400,000 applicants and found lawful, attached to a programme that still cost $89m and the partnership. Nothing that went wrong afterwards was a model problem.</div><div><b>Being right is not the same as being defensible.</b> The gap between those two is where architects earn their money.</div></div>
  <div class="maprow3" style="grid-template-columns:0.94fr 1.48fr 1.42fr"><div><b>HOLD A POSITION THAT IS NOT YOURS, AND STILL CONVERGE</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)">A whole session at the round table inside one seat, with a rule that nobody proposes anything until every seat has spoken, and a deliverable that forces the dissent onto the page.</div><div>This is the meeting. Not the diagram, not the platform choice. The room where ten defensible positions have to become one sentence somebody signs.</div></div>
  <div class="mapnote">The round table is deliberately different from arguing your own view. <b>Defending a position you did not choose is the only reliable way to find out it was never stupid.</b> Half of consultative work is being able to say somebody else's objection better than they can, before they say it.</div>
</div>
<div class="listen reveal">
  <div class="lsitem"><div class="lh">What this builds toward</div><p>Everything today pushes on the same habit: <b>choosing a pattern because of a constraint, and being able to show the constraint</b>. A design justified by familiarity and a design justified by a named constraint can look identical on a diagram, and they are not the same artefact.</p></div>
  <div class="lsitem"><div class="lh">Why a round table rather than another breakout</div><p>A breakout lets everybody argue from where they already stand, so the strongest personality wins and the room learns nothing about itself. <b>Fixed seats remove that.</b> You cannot retreat to your own opinion, and you find out which objections you had been quietly discounting.</p></div>
  <div class="lsitem"><div class="lh">The honest limit</div><p>Nobody is a better architect because of one session. What you have is the <b>shape</b> of the translation step, one rehearsal of refusing a request out loud, and the memory of holding a seat you disagreed with. The next time a request arrives with a technology already in it, that is what fires.</p></div>
</div>`,

const TITLES = ["Cover","Where we left off: the pre-mortem read-out","Architecture thinking: the four pillars","Architecture thinking: the 4E model","Break","ROUND TABLE: the situation","ROUND TABLE: the ten seats","ROUND TABLE: the brief","Debrief board","Why today was built this way","Thank you"];


/* ============================================================= ENGINE */
const stage=document.getElementById('stage');
let cur=0, revealStops=[], revealIdx=0;
SLIDES.forEach((html,i)=>{ const s=document.createElement('section'); s.className='slide'; s.dataset.title=TITLES[i]||('Slide '+i); s.innerHTML=html; stage.appendChild(s); });
const slideEls=[...document.querySelectorAll('.slide')];

function buildQuiz(el){
  const kind=el.dataset.quiz; const d=QUIZ[kind]; const parent=el.parentElement;
  let opts=d.q.opts.map(o=>`<div class="qopt" data-ok="${o.ok}" onclick="quizPick(this)"><span class="k">${o.k}</span><span>${o.t}</span></div>`).join('');
  parent.innerHTML=
   `<div class="eyebrow reveal"><span class="dot"></span> ${d.eyebrow}</div>
    <h2 class="reveal">${d.title}</h2>
    <div class="quiz reveal"><p class="big" style="color:var(--ink)">${d.q.prompt}</p>
      <div class="qopts">${opts}</div>
      <div class="qfb" id="qfb-${kind}"></div></div>`;
  parent.dataset.qkind=kind;
}
function buildWidgets(s){
  const qz=s.querySelector('[data-quiz]'); if(qz) buildQuiz(qz);
  if(s.querySelector('#qchips')) buildSort();
  if(s.querySelector('#jboard')) buildJeopardy();
  if(s.querySelector('#poll')) buildPoll();
  if(s.querySelector('#scoreit')) buildScore();
  if(s.querySelector('#stepquiz')) buildStepQuiz();
  if(s.querySelector('#oibuild')) buildOI();
  if(s.querySelector('.podpad[data-pad]')) buildPodPad();
  if(s.querySelector('#walk')) buildWalk();
  if(typeof mtClearAll==='function') mtClearAll();
}
function enterHooks(s){
  if(s.querySelector('#heatmap')) heatUpdate();
  if(s.querySelector('#lenspanel')) lensRender();
  if(s.querySelector('#typed')) typeWriter();
  if(s.querySelector('.chklist')) chkInit(s);
}
function enter(n, full){
  if(!slideEls || !slideEls.length) return;
  n = Math.max(0, Math.min(slideEls.length-1, n|0));
  if(slideEls[cur]) slideEls[cur].classList.remove('active');
  cur=n; const s=slideEls[cur];
  if(!s) return;
  buildWidgets(s);
  s.classList.add('active');
  const rv=[...s.querySelectorAll('.reveal')]; revealStops=rv;
  rv.forEach(r=>r.classList.remove('show'));
  if(full){ rv.forEach(r=>r.classList.add('show')); revealIdx=rv.length; }
  else { if(rv.length){ rv[0].classList.add('show'); revealIdx=1; } else revealIdx=0; }
  document.getElementById('prog').style.width=(cur/(SLIDES.length-1)*100)+'%';
  document.getElementById('pageno').textContent=String(cur+1).padStart(2,'0');
  enterHooks(s);
}
function show(n){ enter(Math.max(0,Math.min(SLIDES.length-1,n)), false); }
function next(){
  if(revealIdx<revealStops.length){ revealStops[revealIdx].classList.add('show'); revealIdx++; return; }
  if(cur<SLIDES.length-1) enter(cur+1,false);
}
function prev(){
  if(revealIdx>1){ revealIdx--; revealStops[revealIdx].classList.remove('show'); return; }
  if(cur>0) enter(cur-1,true);   // land on previous slide's fully revealed final state
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  else if(k==='w'){toggleWB();} else if(k==='s'){toggleSB();}
  else if(k==='t'){toggleTM();} else if(k==='g'){toggleGrid();}

  const start=e=>{ wbDrawing=true; wbLast=pos(e); e.preventDefault(); };

  c.addEventListener('pointerdown',start); c.addEventListener('pointermove',move); window.addEventListener('pointerup',()=>wbDrawing=false);

  const ctx=c.getContext('2d'); const cols=['#1B65F5','#F5A31B','#2E9E7B','#E5533D','#14213D']; let ps=[];
  for(let i=0;i<160;i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height,r:4+Math.random()*6,col:cols[i%cols.length],vy:2+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6.28,vr:-.2+Math.random()*.4});
  let f=0; (function anim(){ ctx.clearRect(0,0,c.width,c.height); f++;
    ps.forEach(p=>{ p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);ctx.restore(); });

function sqRender(){ const box=document.getElementById('stepquiz'); if(!box)return; box.dataset.done=''; const it=STEPQUIZ[sqIdx];
  box.innerHTML='<div class="scq">Question '+(sqIdx+1)+' of '+STEPQUIZ.length+'</div>'+
  '<div class="scsub" style="margin-bottom:14px">'+it.q+'</div>'+
  '<div class="qopts" style="grid-template-columns:1fr">'+it.opts.map((o,i)=>'<div class="qopt" data-ok="'+o.ok+'" onclick="sqPick(this)"><span class="k">'+String.fromCharCode(65+i)+'</span><span>'+o.t+'</span></div>').join('')+'</div>'+
  '<div class="qfb" id="sqfb"></div>'; }
function sqPick(el){ const box=document.getElementById('stepquiz'); if(box.dataset.done)return; box.dataset.done=1;
  [...el.parentElement.children].forEach(o=>{ if(o.dataset.ok==='true') o.classList.add('correct'); });
  if(el.dataset.ok!=='true') el.classList.add('wrong'); else award(15);
  const it=STEPQUIZ[sqIdx];
  document.getElementById('sqfb').innerHTML=it.fb+(sqIdx<STEPQUIZ.length-1?'<button class="scnext" onclick="sqNext()">Next question</button>':'<div style="margin-top:12px;font-weight:700;color:var(--sage)">That is all three. Nice work.</div>'); }
function sqNext(){ if(sqIdx<STEPQUIZ.length-1){ sqIdx++; sqRender(); } }
/* ---------- work-timer nudge ---------- */
function openWorkTimer(m){ const el=document.getElementById('tm'); if(el&&!el.classList.contains('on')) el.classList.add('on'); tmSet(m); if(!tmRun) tmToggle(); }

/* ---------- boot ---------- */
loadTeams(); renderTeams(); enter(0,false);
</script>
</body>
